services:
  training-assistant:
    image: ghcr.io/fracon/training-assistant:latest
    container_name: training-assistant
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      GARMIN_PILOT_ENABLED: ${GARMIN_PILOT_ENABLED:-false}
      GARMIN_PILOT_USER_ID: ${GARMIN_PILOT_USER_ID:-}
      KINESIS_GARMIN_SERVICE_TOKEN: ${KINESIS_GARMIN_SERVICE_TOKEN:-}
      GARMIN_CONNECTOR_URL: http://garmin-connector:8080
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL_CYCLE: ${AI_MODEL_CYCLE:-gpt-6.1-sol}
      AI_MODEL_WORKOUTS: ${AI_MODEL_WORKOUTS:-gpt-6.1-sol}
      AI_MODEL_ANALYSIS: ${AI_MODEL_ANALYSIS:-gpt-6.1-sol}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8192}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-120000}
      AI_CONCURRENCY_USER: ${AI_CONCURRENCY_USER:-1}
      AI_CONCURRENCY_GLOBAL: ${AI_CONCURRENCY_GLOBAL:-2}
      AI_DAILY_TOKENS_USER: ${AI_DAILY_TOKENS_USER:-100000}
      AI_DAILY_TOKENS_GLOBAL: ${AI_DAILY_TOKENS_GLOBAL:-500000}
      AI_DAILY_CALLS_USER: ${AI_DAILY_CALLS_USER:-10}
      AI_DAILY_CALLS_GLOBAL: ${AI_DAILY_CALLS_GLOBAL:-100}
      AI_DAILY_USD_USER: ${AI_DAILY_USD_USER:-2}
      AI_DAILY_USD_GLOBAL: ${AI_DAILY_USD_GLOBAL:-20}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-12000}
      AI_DETAIL_DAYS: ${AI_DETAIL_DAYS:-14}
      AI_HISTORY_WEEKS: ${AI_HISTORY_WEEKS:-12}
      AI_RETENTION_DAYS: ${AI_RETENTION_DAYS:-90}
      AI_RETRIES: ${AI_RETRIES:-1}
    volumes:
      - ./data:/app/data
  garmin-connector:
    image: ghcr.io/fracon/kinesis-garmin-connector:0.27.0
    build:
      context: ./services/garmin-connector
      dockerfile: Dockerfile
    container_name: kinesis-garmin-connector
    restart: unless-stopped
    environment:
      KINESIS_GARMIN_SERVICE_TOKEN: ${KINESIS_GARMIN_SERVICE_TOKEN:-}
      GARMIN_PILOT_ENABLED: ${GARMIN_PILOT_ENABLED:-false}
      GARMIN_PILOT_USER_ID: ${GARMIN_PILOT_USER_ID:-}
      GARMIN_ENCRYPTION_KEY: ${GARMIN_ENCRYPTION_KEY:-}
      GARMIN_STORE: /var/lib/kinesis-garmin
    volumes:
      - garmin-tokens:/var/lib/kinesis-garmin
    # No published host port: only containers on this Compose network can reach it.
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
    stop_grace_period: 20s
volumes:
  garmin-tokens:
