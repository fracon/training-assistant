<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/brand/favicon.png?v=5" type="image/png">
  <title data-i18n="cycles.pageTitle">Training Cycles - Kinesis</title>
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="shared/components.css">
  <link rel="stylesheet" href="cycles.css">
  <link rel="stylesheet" href="shared/external-prompt-modal.css">
</head>
<body>
  <main id="appView">
    <section class="cycles-page">
      <header class="cycles-header">
        <div class="cycles-header-text">
          <h1 data-i18n="cycles.title">Training Cycles</h1>
          <p class="cycles-subtitle" data-i18n="cycles.subtitle">Manage your macrocycle and training blocks</p>
        </div>
        <span class="add-cycle-wrapper">
          <button type="button" id="addCycleBtn" class="btn-primary">
            <i data-lucide="plus"></i>
            <span data-i18n="cycles.addCycle">Add Cycle</span>
          </button>
          <div class="custom-tooltip"></div>
        </span>
      </header>

      <div id="cycleEmpty" class="cycles-empty hidden">
        <i data-lucide="repeat"></i>
        <p data-i18n="cycles.empty">No training cycles yet.</p>
        <p class="cycles-empty-hint" data-i18n="cycles.emptyHint">Create your first training cycle to organize your macrocycle.</p>
      </div>

      <div id="cycleList" class="cycle-list"></div>
    </section>
  </main>

  <div id="cycleModal" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cycleModalTitle">
      <header class="modal-header">
        <h2 id="cycleModalTitle" data-i18n="cycles.formTitleAdd">Add New Cycle</h2>
        <button type="button" id="cycleModalCloseBtn" class="modal-close" aria-label="Close">
          <i data-lucide="x"></i>
        </button>
      </header>
      <form id="cycleForm" novalidate>
        <div class="field">
          <label for="cycleObjective" data-i18n="cycles.objective">Objective</label>
          <input type="text" id="cycleObjective" data-i18n-placeholder="cycles.objectivePlaceholder" placeholder="e.g.: Marathon, Half Marathon" required>
        </div>
        <div class="field">
          <label for="cycleTargetDate" data-i18n="cycles.targetDate">Target date</label>
          <input type="text" id="cycleTargetDate" autocomplete="off" aria-describedby="cycleTargetDateHelp">
          <p id="cycleTargetDateHelp" class="field-hint" data-i18n="cycles.targetDateHelp">Deadline for your goal. A race is optional.</p>
        </div>
        <div class="field">
          <label for="cycleDistance" data-i18n="cycles.distance">Distance</label>
          <select id="cycleDistance">
            <option value="">–</option>
            <option value="1km" data-i18n="cycles.distances.1km">1 km</option>
            <option value="3km" data-i18n="cycles.distances.3km">3 km</option>
            <option value="5km" data-i18n="cycles.distances.5km">5 km</option>
            <option value="10km" data-i18n="cycles.distances.10km">10 km</option>
            <option value="15km" data-i18n="cycles.distances.15km">15 km</option>
            <option value="half_marathon" data-i18n="cycles.distances.half_marathon">Half Marathon</option>
            <option value="marathon" data-i18n="cycles.distances.marathon">Marathon</option>
          </select>
        </div>
        <div class="field">
          <label for="cycleRunBefore" data-i18n="cycles.runBefore">Run this distance before?</label>
          <select id="cycleRunBefore">
            <option value="">–</option>
            <option value="Sim" data-i18n="common.yes">Yes</option>
            <option value="Não" data-i18n="common.no">No</option>
          </select>
        </div>
        <div class="field">
          <label for="cycleRunCount" data-i18n="cycles.runCount">How many times</label>
          <input type="number" id="cycleRunCount" min="0">
        </div>
        <div class="field">
          <label for="cycleStartDate" data-i18n="cycles.startDate">Start date</label>
          <input type="text" id="cycleStartDate" autocomplete="off">
        </div>
        <div class="field">
          <label for="cyclePrimaryGoal" data-i18n="cycles.primaryGoal">Primary goal</label>
          <input type="text" id="cyclePrimaryGoal" data-i18n-placeholder="cycles.primaryGoalPlaceholder">
        </div>
        <div class="field">
          <label for="cycleSecondaryGoal" data-i18n="cycles.secondaryGoal">Secondary goal</label>
          <input type="text" id="cycleSecondaryGoal" data-i18n-placeholder="cycles.secondaryGoalPlaceholder">
        </div>
        <div class="field field-wide">
          <label for="cycleOtherEvents" data-i18n="cycles.otherEvents">Other events during cycle</label>
          <textarea id="cycleOtherEvents" rows="2" class="prompt-textarea" data-i18n-placeholder="cycles.otherEventsPlaceholder"></textarea>
        </div>
        <div id="cycleFormError" class="form-error hidden"></div>
        <div class="form-actions">
          <button type="button" id="cycleCancelBtn" class="btn-secondary" data-i18n="cycles.cancelForm">Cancel</button>
          <button type="submit" id="cycleSaveBtn" class="btn-primary">
            <span id="cycleSaveLabel" data-i18n="cycles.saveCycle">Save Cycle</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="promptModal" hidden></div>

  <div id="cyclePlanningModal" class="modal-backdrop cycle-planning-modal" hidden>
    <div class="modal-card cycle-planning-card" role="dialog" aria-modal="true" aria-labelledby="cyclePlanningHeading" aria-describedby="cyclePlanningHint">
      <header class="modal-header">
        <h2 id="cyclePlanningHeading" data-i18n="cyclePlanning.title">Cycle planning</h2>
        <button id="cyclePlanningClose" type="button" class="modal-close" data-i18n-aria-label="cyclePlanning.close" aria-label="Close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cycle-planning-body">
        <p id="cyclePlanningHint" class="field-hint"></p>
        <p id="cyclePlanningStatus" class="cycle-planning-state" role="status" aria-live="polite"></p>
        <p id="cyclePlanningError" class="form-error" role="alert" tabindex="-1" hidden></p>
        <div id="cyclePlanningContent" class="cycle-planning-content"></div>
        <section id="cyclePlanningAdmin" class="cycle-plan-section" aria-labelledby="cyclePlanningDebugHeading" hidden>
          <h3 id="cyclePlanningDebugHeading" data-i18n="cyclePlanning.admin">Administrator details</h3>
          <button id="cyclePlanningDebug" type="button" class="btn-secondary" hidden data-i18n="cyclePlanning.debug">Inspect my execution</button>
          <div id="cyclePlanningDebugDetails" hidden><pre id="cyclePlanningDebugOutput" class="prompt-output"></pre></div>
        </section>
      </div>
      <footer id="cyclePlanningActions" class="form-actions confirm-actions" data-action-count="2">
        <button id="cyclePlanningLater" type="button" class="btn btn-secondary">Not now</button>
        <button id="cyclePlanningRetry" type="button" class="btn btn-primary" hidden data-i18n="cyclePlanning.retry">Try again</button>
        <button id="cyclePlanningCancel" type="button" class="btn btn-secondary" hidden data-i18n="cyclePlanning.cancel">Cancel generation</button>
        <button id="cyclePlanningGenerate" type="button" class="btn btn-primary" disabled data-i18n="cyclePlanning.generate">Generate planning</button>
        <button id="cyclePlanningApply" type="button" class="btn btn-primary" hidden data-i18n="cyclePlanning.apply">Apply proposal</button>
      </footer>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <span class="toast-icon"><i data-lucide="check-circle"></i></span>
    <span class="toast-text"></span>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared/shell.js" type="module"></script>
  <script src="cycles.js" type="module"></script>
</body>
</html>
