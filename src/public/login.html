<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In • Training Assistant</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Training Assistant</span>
    <span class="dot">•</span>
    <span class="tagline">Local &amp; Offline</span>
  </header>

  <section class="auth-view" aria-label="Sign in">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="auth-eyebrow">Training Assistant</span>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to keep your training log on track.</p>
      </div>

      <form id="loginForm" class="auth-panel" autocomplete="on" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email"
            placeholder="you@example.com">
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input type="password" id="password" name="password" required
            autocomplete="current-password" placeholder="••••••••">
        </div>
        <p id="formError" class="auth-message" role="alert"></p>
        <button id="submitBtn" class="btn-primary" type="submit">Sign In</button>
        <a class="auth-alt" href="/register.html">Don't have an account? <strong>Register</strong></a>
      </form>
    </div>
  </section>

  <script src="login.js" type="module"></script>
</body>
</html>
