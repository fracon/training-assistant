<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Session • Kinesis</title>
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="training-result.css">
</head>
<body>
  <main id="appView">
    <section class="session-page">
      <header class="session-header">
        <h1 data-i18n="session.title">Training Session</h1>
        <p id="sessionDate" class="session-date"></p>
      </header>

      <p id="status" class="status" role="status"></p>

      <section class="card planned-card" aria-labelledby="plannedTitle">
        <h2 id="plannedTitle" data-i18n="session.plannedHeading">Planned workout</h2>
        <dl class="planned-grid">
          <div class="planned-item">
            <dt data-i18n="session.fieldTipo">Type</dt>
            <dd id="plannedTipo">-</dd>
          </div>
          <div class="planned-item">
            <dt data-i18n="session.fieldTreino">Workout</dt>
            <dd id="plannedTreino">-</dd>
          </div>
          <div class="planned-item planned-item-wide">
            <dt data-i18n="session.fieldDetalhes">Details</dt>
            <dd id="plannedDetalhes">-</dd>
          </div>
          <div class="planned-item">
            <dt data-i18n="session.fieldFcAlvo">Target HR</dt>
            <dd id="plannedFcAlvo">-</dd>
          </div>
          <div class="planned-item">
            <dt data-i18n="session.fieldRpe">Target RPE</dt>
            <dd id="plannedRpe">-</dd>
          </div>
          <div class="planned-item">
            <dt data-i18n="session.fieldTenis">Shoes</dt>
            <dd id="plannedTenis">-</dd>
          </div>
        </dl>
      </section>

      <section class="card feedback-card" aria-labelledby="feedbackTitle">
        <h2 id="feedbackTitle" data-i18n="session.feedbackHeading">Your feedback</h2>
        <div class="feedback-grid">
          <div class="field field-wide">
            <span class="field-label" data-i18n="session.realizedRpeLabel">Realized RPE (1 to 5)</span>
            <div class="rpe-selector" id="feedbackRpe">
              <input type="radio" name="rpe" id="rpe-1" value="1" class="sr-only">
              <label for="rpe-1" class="rpe-emoji"><span class="emoji-icon">🥱</span><div class="custom-tooltip" data-i18n="session.rpeLabel1"></div></label>
              <input type="radio" name="rpe" id="rpe-2" value="2" class="sr-only">
              <label for="rpe-2" class="rpe-emoji"><span class="emoji-icon">🙂</span><div class="custom-tooltip" data-i18n="session.rpeLabel2"></div></label>
              <input type="radio" name="rpe" id="rpe-3" value="3" class="sr-only">
              <label for="rpe-3" class="rpe-emoji"><span class="emoji-icon">😅</span><div class="custom-tooltip" data-i18n="session.rpeLabel3"></div></label>
              <input type="radio" name="rpe" id="rpe-4" value="4" class="sr-only">
              <label for="rpe-4" class="rpe-emoji"><span class="emoji-icon">🥵</span><div class="custom-tooltip" data-i18n="session.rpeLabel4"></div></label>
              <input type="radio" name="rpe" id="rpe-5" value="5" class="sr-only">
              <label for="rpe-5" class="rpe-emoji"><span class="emoji-icon">💀</span><div class="custom-tooltip" data-i18n="session.rpeLabel5"></div></label>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="smartwatchSelect"
              data-i18n="session.fieldSmartwatch">Smartwatch used?</label>
            <select id="smartwatchSelect" class="input-control">
              <option value="sim" selected data-i18n="session.smartwatchYes">Yes</option>
              <option value="nao" data-i18n="session.smartwatchNo">No</option>
            </select>
          </div>
          <div class="field fit-field" id="fitField">
            <label for="fitFile" class="file-dropzone" id="fitDropzone">
              <input type="file" id="fitFile" accept=".fit" style="display: none;">
              <div class="dropzone-text-primary">
                <span data-i18n-html="session.fitDragText">Drag your <strong>.FIT</strong> file here</span>
              </div>
              <div class="dropzone-text-secondary" data-i18n="session.fitClickText">or click to select from your computer</div>
            </label>
          </div>

          <div class="field field-wide fit-data-section" id="fitDataSection" hidden>
            <h3 class="fit-data-title" data-i18n="session.fitDataHeading">Parsed FIT Data</h3>
            <dl class="fit-data-grid">
              <div class="fit-data-item">
                <dt data-i18n="session.fitDuration">Duration</dt>
                <dd id="fitDuration">-</dd>
              </div>
              <div class="fit-data-item">
                <dt data-i18n="session.fitDistance">Distance</dt>
                <dd id="fitDistance">-</dd>
              </div>
              <div class="fit-data-item">
                <dt data-i18n="session.fitAvgPace">Avg Pace</dt>
                <dd id="fitAvgPace">-</dd>
              </div>
              <div class="fit-data-item">
                <dt data-i18n="session.fitAvgHr">Avg HR</dt>
                <dd id="fitAvgHr">-</dd>
              </div>
              <div class="fit-data-item">
                <dt data-i18n="session.fitMaxHr">Max HR</dt>
                <dd id="fitMaxHr">-</dd>
              </div>
              <div class="fit-data-item">
                <dt data-i18n="session.fitElevation">Elevation Gain</dt>
                <dd id="fitElevation">-</dd>
              </div>
            </dl>
            <div class="fit-laps-section" id="fitLapsSection" hidden>
              <h3 class="fit-data-title" data-i18n="session.fitLapsHeading">Lap by Lap</h3>
              <div class="fit-laps-wrapper">
                <table class="fit-laps-table" id="fitLapsTable">
                  <thead>
                    <tr>
                      <th data-i18n="session.fitLap">#</th>
                      <th data-i18n="session.fitLapType">Type</th>
                      <th data-i18n="session.fitLapDistance">Distance</th>
                      <th data-i18n="session.fitLapDuration">Duration</th>
                      <th data-i18n="session.fitLapPace">Pace</th>
                      <th data-i18n="session.fitLapHr">HR</th>
                    </tr>
                  </thead>
                  <tbody id="fitLapsBody"></tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="field-label" for="feedbackShoe"
              data-i18n="session.fieldShoeUsed">Shoe used</label>
            <select id="feedbackShoe" class="input-control">
              <option value="">–</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="hrSourceSelect"
              data-i18n="session.fieldHrSource">HR source</label>
            <select id="hrSourceSelect" class="input-control">
              <option value="">–</option>
              <option value="chest_strap" data-i18n="session.hrSourceStrap">Chest strap</option>
              <option value="optical_watch" data-i18n="session.hrSourceOptical">Watch optical sensor</option>
              <option value="none" data-i18n="session.hrSourceNone">No HR</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="feedbackWeather"
              data-i18n="session.fieldWeather">Temperature &amp; weather</label>
            <input type="text" id="feedbackWeather" class="input-control"
              autocomplete="off" data-i18n-placeholder="session.weatherPlaceholder">
          </div>
          <div class="field">
            <label class="field-label" for="feedbackTerrain"
              data-i18n="session.fieldTerrain">Terrain/route</label>
            <select id="feedbackTerrain" class="input-control">
              <option value="">–</option>
              <option value="asphalt" data-i18n="terrain.asphalt">Asphalt</option>
              <option value="trail" data-i18n="terrain.trail">Trail / Dirt</option>
              <option value="track" data-i18n="terrain.track">Track</option>
              <option value="treadmill" data-i18n="terrain.treadmill">Treadmill</option>
              <option value="mixed" data-i18n="terrain.mixed">Mixed</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="feedbackBreathing"
              data-i18n="session.fieldBreathing">Breathing</label>
            <select id="feedbackBreathing" class="input-control">
              <option value="">–</option>
              <option value="controlled" data-i18n="breathing.controlled">Controlled</option>
              <option value="panting" data-i18n="breathing.panting">Panting</option>
              <option value="heavy" data-i18n="breathing.heavy">Very out of breath</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="feedbackMuscle"
              data-i18n="session.fieldMuscle">Muscle sensation</label>
            <select id="feedbackMuscle" class="input-control">
              <option value="">–</option>
              <option value="light" data-i18n="muscle.light">Light</option>
              <option value="normal" data-i18n="muscle.normal">Normal</option>
              <option value="heavy" data-i18n="muscle.heavy">Heavy</option>
              <option value="fatigued" data-i18n="muscle.fatigued">Fatigued</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="feedbackEnergy"
              data-i18n="session.fieldEnergy">Energy at finish</label>
            <select id="feedbackEnergy" class="input-control">
              <option value="">–</option>
              <option value="surplus" data-i18n="energy.surplus">Energy left</option>
              <option value="limit" data-i18n="energy.limit">On the limit</option>
              <option value="exhausted" data-i18n="energy.exhausted">Exhausted</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="feedbackHasPain"
              data-i18n="feedback.hasPainLabel">Any pain or discomfort?</label>
            <select id="feedbackHasPain" class="input-control">
              <option value="no" data-i18n="common.no">No</option>
              <option value="yes" data-i18n="common.yes">Yes</option>
            </select>
          </div>
          <div class="field field-wide pain-field" id="painDescriptionContainer" hidden>
            <label class="field-label" for="feedbackPain"
              data-i18n="feedback.painDescriptionLabel">Pain description</label>
            <textarea id="feedbackPain" rows="3" class="input-control"
              placeholder="e.g.: mild twinge in the right Achilles tendon after km 8..."
              data-i18n-placeholder="feedback.painPlaceholder"></textarea>
          </div>

          <div class="field field-wide">
            <label class="field-label" for="feedbackNotas"
              data-i18n="session.freeFeedbackLabel">Free feedback</label>
            <textarea id="feedbackNotas" rows="4" class="input-control"
              placeholder="How was the workout? Sleep, weather, general sensations..."
              data-i18n-placeholder="session.freeFeedbackPlaceholder"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button id="saveBtn" class="btn-secondary" type="button"
            data-i18n="session.save">Save and back to calendar</button>
          <button id="generateBtn" class="btn-primary" type="button">
            <i data-lucide="sparkles" aria-hidden="true"></i>
            <span data-i18n="session.generatePrompt">Generate analysis prompt</span>
          </button>
        </div>

        <div class="prompt-section" id="promptSection" hidden>
          <div class="prompt-header">
            <h3 data-i18n="session.promptHeading">Generated Prompt</h3>
            <button id="copyPromptBtn" class="btn-secondary btn-small" type="button">
              <i data-lucide="copy" aria-hidden="true"></i>
              <span data-i18n="session.copyPrompt">Copy to clipboard</span>
            </button>
          </div>
          <textarea id="promptOutput" class="input-control prompt-output" rows="16" readonly></textarea>
        </div>
      </section>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared/shell.js" type="module"></script>
  <script src="training-result.js" type="module"></script>
</body>
</html>
