<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training Result • Training Assistant</title>
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="training-result.css">
</head>
<body>
  <main id="appView">
    <form id="workoutForm" autocomplete="off">
      <section class="card form-card">
        <fieldset class="group">
        <legend data-i18n="training.plannedLegend">Planned Workout</legend>
        <div class="grid grid-3">
          <div class="field">
            <label class="field-label" for="tipo_treino" data-i18n="training.typeLabel">Workout type</label>
            <select id="tipo_treino" name="tipo_treino">
              <option value="">—</option>
              <option value="Leve">Leve</option>
              <option value="Longão">Longão</option>
              <option value="Intervalado">Intervalado</option>
              <option value="Ritmo">Ritmo</option>
              <option value="Recuperação">Recuperação</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="fc_alvo" data-i18n="training.targetHrLabel">Target HR</label>
            <input type="text" id="fc_alvo" name="fc_alvo" placeholder="e.g.: 145–155 bpm">
          </div>
          <div class="field">
            <label class="field-label" for="rpe_alvo" data-i18n="training.targetRpeLabel">Target RPE</label>
            <select id="rpe_alvo" name="rpe_alvo">
              <option value="">—</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="treino_planejado" data-i18n="training.plannedLabel">Planned workout</label>
          <textarea id="treino_planejado" name="treino_planejado" rows="2" class="auto-grow"
            placeholder="e.g.: 5 km warm-up + 6×1 km hard (3:50–4:00) with 400 m jog"
            data-i18n-placeholder="training.plannedPlaceholder"></textarea>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="training.contextLegend">Context &amp; Gear</legend>
        <div class="grid grid-2x2">
          <div class="field">
            <label class="field-label" for="tenis" data-i18n="training.shoesLabel">Shoes</label>
            <input type="text" id="tenis" name="tenis" placeholder="e.g.: Nimbus 26"
              data-i18n-placeholder="training.shoesPlaceholder">
          </div>
          <div class="field">
            <label class="field-label" for="fonte_fc" data-i18n="training.hrSourceLabel">HR source</label>
            <select id="fonte_fc" name="fonte_fc">
              <option value="">—</option>
              <option value="Cinta Peitoral">Cinta Peitoral</option>
              <option value="Sensor Óptico do Relógio">Sensor Óptico do Relógio</option>
              <option value="Sem FC">Sem FC</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="clima" data-i18n="training.weatherLabel">Temperature &amp; weather</label>
            <input type="text" id="clima" name="clima" placeholder="e.g.: 22°C, Cloudy, light wind"
              data-i18n-placeholder="training.weatherPlaceholder">
          </div>
          <div class="field">
            <label class="field-label" for="terreno" data-i18n="training.terrainLabel">Terrain/route</label>
            <select id="terreno" name="terreno">
              <option value="">—</option>
              <option value="Asfalto">Asfalto</option>
              <option value="Terra/Trilha">Terra/Trilha</option>
              <option value="Pista">Pista</option>
              <option value="Esteira">Esteira</option>
              <option value="Misto">Misto</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="training.effortLegend">Perceived Exertion</legend>
        <div class="field">
          <span class="field-label" data-i18n="training.rpePerceivedLabel">Perceived RPE — effort (1 to 5)</span>
          <div class="rpe-row" id="rpeRow"></div>
        </div>
        <div class="grid grid-3">
          <div class="field">
            <label class="field-label" for="respiracao" data-i18n="training.breathingLabel">Breathing</label>
            <select id="respiracao" name="respiracao">
              <option value="">—</option>
              <option value="Controlada">Controlada</option>
              <option value="Ofegante">Ofegante</option>
              <option value="Muito Ofegante">Muito Ofegante</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="sensacao_muscular" data-i18n="training.muscleFeelLabel">Muscle sensation</label>
            <select id="sensacao_muscular" name="sensacao_muscular">
              <option value="">—</option>
              <option value="Leve">Leve</option>
              <option value="Normal">Normal</option>
              <option value="Pesada">Pesada</option>
              <option value="Fadigada">Fadigada</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="energia_final" data-i18n="training.endEnergyLabel">Energy at the end</label>
            <select id="energia_final" name="energia_final">
              <option value="">—</option>
              <option value="Sobrava energia">Sobrava energia</option>
              <option value="No limite">No limite</option>
              <option value="Esgotado">Esgotado</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="training.feedbackLegend">Feedback</legend>
        <div class="field">
          <label class="field-label" for="dor_desconforto" data-i18n="training.discomfortLabel">Pain or discomfort</label>
          <textarea id="dor_desconforto" name="dor_desconforto" rows="2" class="auto-grow"
            placeholder="e.g.: mild ache in the right Achilles tendon after km 8…"
            data-i18n-placeholder="training.discomfortPlaceholder"></textarea>
        </div>
        <div class="field">
          <label class="field-label" for="feedback_livre" data-i18n="training.freeFeedbackLabel">Free feedback</label>
          <textarea id="feedback_livre" name="feedback_livre" rows="2" class="auto-grow"
            placeholder="How did it go? Sleep, weather, overall sensations…"
            data-i18n-placeholder="training.freeFeedbackPlaceholder"></textarea>
        </div>
      </fieldset>
      </section>

      <section id="dropzone" class="dropzone" role="button" tabindex="0" aria-label="Select a .FIT file"
        data-i18n-aria-label="training.ariaDropzone">
        <p class="drop-title" id="dropTitle"
          data-i18n-html="training.dropTitleHtml">Drop your <strong>.FIT</strong> file here</p>
        <p class="drop-sub" id="dropSub" data-i18n="training.dropSub">or click to pick one from your computer</p>
        <input type="file" id="fileInput" accept=".fit" hidden>
      </section>

      <button id="generateBtn" class="btn-primary" type="submit" disabled
        data-i18n="training.generate">Generate Prompt</button>
    </form>

    <p id="status" class="status" role="status"></p>

    <section id="resultsFlow" class="results-flow" aria-live="polite">
      <div class="meta" id="metaRow"></div>

      <div class="card table-card">
        <table>
          <thead><tr id="lapsHead"></tr></thead>
          <tbody id="lapsBody"></tbody>
        </table>
      </div>

      <section class="prompt-block">
        <h2 class="section-title" data-i18n="training.promptHeading">Prompt for the AI Coach — review before copying</h2>
        <textarea id="markdownPreview" class="prompt-textarea" readonly spellcheck="false"></textarea>
      </section>

      <button id="copyBtn" class="copy-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        <span id="copyLabel" data-i18n="training.copyPrompt">Copy Prompt</span>
      </button>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="form-state.js" defer></script>
  <script src="training-result.js" type="module"></script>
</body>
</html>
