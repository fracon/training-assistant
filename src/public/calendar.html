<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/brand/favicon.png?v=5" type="image/png">
  <title data-i18n="calendar.pageTitle">Workouts - Kinesis</title>
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="shared/components.css">
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <main id="appView">
    <section class="calendar-page">
      <header class="calendar-header">
        <h1 data-i18n="calendar.title">Workouts</h1>

        <div class="calendar-actions">
          <div class="week-start-picker">
            <span class="week-start-label" data-i18n="calendar.weekStartLabel">Start of week:</span>
            <div class="week-start-switch" role="group" aria-label="Week starts on"
              data-i18n-aria-label="calendar.firstDayLabel">
              <button type="button" id="mondayBtn" data-week-start="Monday">Mon</button>
              <button type="button" id="sundayBtn" data-week-start="Sunday">Sun</button>
            </div>
          </div>

          <div class="month-nav">
            <button type="button" id="prevMonthBtn" aria-label="Previous month"
              data-i18n-aria-label="calendar.previousMonth">
              <i data-lucide="chevron-left"></i>
            </button>
            <h2 id="monthTitle">—</h2>
            <button type="button" id="nextMonthBtn" aria-label="Next month"
              data-i18n-aria-label="calendar.nextMonth">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>

          <button type="button" id="importBtn" class="import-btn">
            <span class="import-icon"><i data-lucide="file-spreadsheet"></i></span>
            <span class="import-full" data-i18n="calendar.import.button">Import trainings</span><span class="import-compact" data-i18n="calendar.import.compact">Import</span>
            <div class="custom-tooltip" data-i18n="calendar.import.tooltip"></div>
          </button>
          <input type="file" id="importInput" accept=".xlsx,.xls" hidden>
        </div>
      </header>

      <p id="calendarStatus" class="visually-hidden" role="status" aria-live="polite"></p>

      <div id="calendarGrid" class="calendar-grid" aria-label="Monthly calendar"
        data-i18n-aria-label="calendar.gridLabel"></div>
      <section id="phoneCalendar" class="phone-calendar" aria-label="Week agenda" data-i18n-aria-label="calendar.agenda.label">
        <div id="miniMonth" class="mini-month"></div>
        <div class="mini-legend" aria-hidden="true"><span><i class="session-dot planned"></i> <span data-i18n="calendar.agenda.planned"></span></span><span><i class="session-dot completed"></i> <span data-i18n="calendar.agenda.completed"></span></span></div>
        <h2 id="agendaWeekTitle" class="agenda-week-title"></h2>
        <div id="weekAgenda" aria-labelledby="agendaWeekTitle"></div>
      </section>
    </section>

    <div id="importModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
      <div class="modal-card">
        <h3 id="importModalTitle" data-i18n="calendar.import.failedTitle">We found issues in your spreadsheet</h3>
        <ul id="importErrorList" class="import-error-list"></ul>
        <button type="button" id="importModalClose" class="modal-close" data-i18n="calendar.import.close">Close</button>
      </div>
    </div>
  </main>

  <div id="moveModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="moveTitle" aria-describedby="moveTrainingTitle">
    <form id="moveForm" class="modal-card move-card">
      <h3 id="moveTitle" tabindex="-1" data-i18n="calendar.move.title">Move to another date</h3>
      <p id="moveTrainingTitle"></p>
      <div class="field"><label class="field-label" for="moveDate" data-i18n="calendar.move.date">New date</label><input type="text" id="moveDate" required autocomplete="off"></div>
      <div class="move-actions"><button type="button" id="moveCancel" class="btn-secondary" data-i18n="calendar.move.cancel">Cancel</button><button type="submit" class="btn-primary" data-i18n="calendar.move.submit">Move</button></div>
    </form>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared/shell.js" type="module"></script>
  <script src="calendar.js" type="module"></script>
</body>
</html>
