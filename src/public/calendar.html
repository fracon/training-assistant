<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/brand/favicon.png?v=3" type="image/png">
  <title data-i18n="calendar.pageTitle">Workouts - Kinesis</title>
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="calendar.css">
</head>
<body>
  <main id="appView">
    <section class="calendar-page">
      <header class="calendar-header">
        <h1 data-i18n="calendar.title">Workouts</h1>

        <div class="calendar-actions">
          <div class="week-start-picker">
            <span class="week-start-label" data-i18n="calendar.weekStartLabel">Start of week:</span>
            <div class="week-start-switch" role="group" aria-label="Week starts on"
              data-i18n-aria-label="calendar.firstDayLabel">
              <button type="button" id="mondayBtn" data-week-start="Monday">Mon</button>
              <button type="button" id="sundayBtn" data-week-start="Sunday">Sun</button>
            </div>
          </div>

          <div class="month-nav">
            <button type="button" id="prevMonthBtn" aria-label="Previous month"
              data-i18n-aria-label="calendar.previousMonth">
              <i data-lucide="chevron-left"></i>
            </button>
            <h2 id="monthTitle">—</h2>
            <button type="button" id="nextMonthBtn" aria-label="Next month"
              data-i18n-aria-label="calendar.nextMonth">
              <i data-lucide="chevron-right"></i>
            </button>
          </div>

          <button type="button" id="importBtn" class="import-btn">
            <span class="import-icon"><i data-lucide="file-spreadsheet"></i></span>
            <span data-i18n="calendar.import.button">Import trainings</span>
            <div class="custom-tooltip" data-i18n="calendar.import.tooltip"></div>
          </button>
          <input type="file" id="importInput" accept=".xlsx,.xls" hidden>
        </div>
      </header>

      <p id="calendarStatus" class="visually-hidden" role="status" aria-live="polite"></p>

      <div id="calendarGrid" class="calendar-grid" aria-label="Monthly calendar"
        data-i18n-aria-label="calendar.gridLabel"></div>
    </section>

    <div id="importModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
      <div class="modal-card">
        <h3 id="importModalTitle" data-i18n="calendar.import.failedTitle">We found issues in your spreadsheet</h3>
        <ul id="importErrorList" class="import-error-list"></ul>
        <button type="button" id="importModalClose" class="modal-close" data-i18n="calendar.import.close">Close</button>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared/shell.js" type="module"></script>
  <script src="calendar.js" type="module"></script>
</body>
</html>
