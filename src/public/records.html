<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/brand/favicon.png?v=5" type="image/png">
<title data-i18n="records.pageTitle">Personal records - Kinesis</title>
<link rel="stylesheet" href="shared/shell.css"><link rel="stylesheet" href="shared/components.css">
<link rel="stylesheet" href="records.css">
</head><body><main id="appView"><section class="records-page" aria-labelledby="recordsTitle">
<header class="records-header"><div class="records-header-text"><h1 id="recordsTitle" tabindex="-1" data-i18n="records.title">Personal records</h1><p class="field-hint" data-i18n="records.subtitle"></p></div></header>
<p id="recordsLoading" role="status" data-i18n="records.loading">Loading records…</p>
<div id="recordsLoadError" class="form-error records-load-error" role="alert" hidden><span data-i18n="records.errors.load"></span><button id="recordsRetry" class="btn-secondary" type="button" data-i18n="records.retry"></button></div>
<p class="field-hint"><span data-i18n="records.note"></span> <span data-i18n="records.syncNote"></span></p><div id="recordsList" class="records-grid"></div>
</section></main><div id="recordFormCard" class="modal-backdrop" hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recordFormTitle">
<header class="modal-header"><h2 id="recordFormTitle" tabindex="-1"></h2><button id="recordClose" class="modal-close" type="button" data-i18n-aria-label="records.cancel"><i data-lucide="x" aria-hidden="true"></i></button></header>
<form id="recordForm" novalidate>
<div id="recordError" class="form-error" role="alert" hidden></div>
<fieldset class="duration-group"><legend class="field-label" data-i18n="records.time"></legend><div class="duration-fields"><div class="field"><label class="field-hint" for="recordHours" data-i18n="records.hours"></label><input id="recordHours" type="number" min="0" max="168" step="1" inputmode="numeric" placeholder="00" aria-describedby="recordError"></div><div class="field"><label class="field-hint" for="recordMinutes" data-i18n="records.minutes"></label><input id="recordMinutes" type="number" min="0" max="59" step="1" inputmode="numeric" placeholder="00" aria-describedby="recordError"></div><div class="field"><label class="field-hint" for="recordSeconds" data-i18n="records.seconds"></label><input id="recordSeconds" type="number" min="0" max="59" step="1" inputmode="numeric" placeholder="00" aria-describedby="recordError"></div>
</div></fieldset>
<div class="field"><label class="field-label" for="recordDate" data-i18n="records.date"></label><input id="recordDate" type="text" aria-describedby="recordError"><button id="recordClearDate" class="btn-secondary" type="button" data-i18n="records.clearDate"></button></div>

<div class="field"><label class="field-label" for="recordRace" data-i18n="records.race"></label><input id="recordRace" type="text" maxlength="120" aria-describedby="recordError"></div>
<div class="form-actions"><button id="recordCancel" class="btn-secondary" type="button" data-i18n="records.cancel"></button><button id="recordSave" class="btn-primary" type="submit" data-i18n="records.save"></button></div>
</form></section>
</div><script src="https://unpkg.com/lucide@latest"></script><script src="records.js" type="module"></script></body></html>
