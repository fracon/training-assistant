<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/brand/favicon.png?v=5" type="image/png">
  <title data-i18n="aiCoach.pageTitle">Request Workouts - Kinesis</title>
  <link rel="stylesheet" href="shared/shell.css">
  <link rel="stylesheet" href="ai-coach.css">
</head>
<body>
  <main id="appView">
    <section class="ai-coach-page">
      <header class="ai-coach-header">
        <h1 data-i18n="aiCoach.title">Request Workouts</h1>
        <p class="ai-coach-subtitle" data-i18n="aiCoach.subtitle">Build a detailed briefing for your external AI coach</p>
      </header>

      <form id="promptForm" class="prompt-form" novalidate>
        <div class="field">
          <label for="targetDate"><span data-i18n="aiCoach.targetDate">Target date</span><span class="required-mark" aria-hidden="true">*</span></label>
          <input type="date" id="targetDate" class="iso-date-input" autocomplete="off" required aria-hidden="true" tabindex="-1">
          <input type="text" id="targetDateDisplay" class="date-input-display" readonly autocomplete="off" aria-describedby="targetDateHint">
          <p id="targetDateHint" class="field-hint" data-i18n="aiCoach.targetDateHint">Week to plan. Defaults to next Monday.</p>
        </div>

        <div class="field">
          <label for="baseLocation"><span data-i18n="aiCoach.baseLocation">Base location</span><span class="required-mark" aria-hidden="true">*</span></label>
          <input type="text" id="baseLocation" data-i18n-placeholder="aiCoach.locationPlaceholder" placeholder="Ex: City, Country" autocomplete="off">
          <p class="field-hint" data-i18n="aiCoach.baseLocationHint">Prefills every day's location. Override individual days in Availability.</p>
        </div>

        <fieldset class="availability-fieldset">
          <legend><span data-i18n="aiCoach.availability">Availability</span><span class="required-mark" aria-hidden="true">*</span></legend>
          <p class="field-hint" data-i18n="aiCoach.availabilityHint">Tell the coach when/where you can run each day.</p>
          <div class="availability-grid" id="availabilityGrid"></div>
        </fieldset>

        <div class="field">
          <label for="optionalContext" data-i18n="aiCoach.optionalContext">Optional context</label>
          <textarea id="optionalContext" rows="3" data-i18n-placeholder="aiCoach.contextPlaceholder"
            placeholder="Examples: travel, schedule changes, poor sleep, fatigue, pain/discomfort, work commitments, inability to run, shoe preference..."></textarea>
        </div>

        <button type="submit" id="generateBtn" class="btn-primary">
          <i data-lucide="sparkles"></i>
          <span data-i18n="aiCoach.generate">Generate Prompt</span>
        </button>
      </form>

      <section id="resultSection" class="result-section hidden" aria-live="polite">
        <div class="result-header">
          <h2 data-i18n="aiCoach.resultTitle">Generated prompt</h2>
          <button type="button" id="copyBtn" class="copy-btn">
            <span class="copy-icon"><i data-lucide="copy"></i></span>
            <span id="copyLabel" data-i18n="aiCoach.copy">Copy to Clipboard</span>
          </button>
        </div>
        <pre id="promptOutput" class="prompt-output" tabindex="0"></pre>
      </section>

    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="shared/shell.js" type="module"></script>
  <script src="ai-coach.js" type="module"></script>
</body>
</html>
