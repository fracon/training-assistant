<!doctype html>
<html lang="en">
<body>
  <section id="dialog" role="dialog" aria-labelledby="initialTitle" aria-describedby="welcomeDescription">
    <h2 id="initialTitle" tabindex="-1">Welcome</h2>
    <button id="close">Close</button>
    <div id="welcomeDescription" data-onboarding-description>
      <video id="welcomeVideo" controls></video><button id="watch">Watch</button>
    </div>
    <button id="later">Not now</button><button id="start">Get started</button>
  </section>
  <script type="module">
    import { trapOnboardingFocus, updateOnboardingDialogA11y, visibleOnboardingFocusableElements } from '/src/public/shared/onboarding.js';

    const dialog = document.getElementById('dialog');
    const visibleIds = () => visibleOnboardingFocusableElements(dialog).map((element) => element.id);
    const checks = [];

    checks.push(updateOnboardingDialogA11y(dialog, dialog));
    checks.push(dialog.getAttribute('aria-labelledby') === 'initialTitle');
    checks.push(dialog.getAttribute('aria-describedby') === 'welcomeDescription');
    checks.push(visibleIds().join(',') === 'close,welcomeVideo,watch,later,start');

    document.getElementById('initialTitle').focus();
    const backwards = new KeyboardEvent('keydown', { key: 'Tab', shiftKey: true, cancelable: true });
    trapOnboardingFocus(backwards, dialog, document.getElementById('initialTitle'));
    checks.push(backwards.defaultPrevented && document.activeElement.id === 'start');
    const forwards = new KeyboardEvent('keydown', { key: 'Tab', cancelable: true });
    trapOnboardingFocus(forwards, dialog, document.getElementById('initialTitle'));
    checks.push(forwards.defaultPrevented && document.activeElement.id === 'close');
    document.body.dataset.a11yResult = checks.every(Boolean) ? 'pass' : JSON.stringify(checks);
  </script>
</body>
</html>
