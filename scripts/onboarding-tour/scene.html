<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Kinesis tour frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=block">
<style>
  /* Tokens copied from src/public/shared/theme.css so the video matches the app. */
  :root {
    --bg: #f4f0e8; --card: #fdfbf6; --ink: #3c352a; --muted: #8b8172;
    --line: #e6dfd1; --line-strong: #d3c9b5; --accent: #6f9070; --accent-deep: #4c6e51;
    --danger: #a5492f; --ok: #55794f; --sun: #c87457; --accent-soft: rgba(111, 144, 112, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; will-change: opacity, transform; }
  svg.icon { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Background motif: a running route drawn across the whole tour. */
  #bg-blob1, #bg-blob2 { position: absolute; border-radius: 50%; filter: blur(2px); }
  #bg-blob1 { width: 560px; height: 560px; background: radial-gradient(circle, rgba(111,144,112,0.16), rgba(111,144,112,0) 70%); }
  #bg-blob2 { width: 460px; height: 460px; background: radial-gradient(circle, rgba(200,116,87,0.10), rgba(200,116,87,0) 70%); }
  #route { position: absolute; inset: 0; }
  #route path { fill: none; stroke: rgba(111,144,112,0.28); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 12; }
  #route .drawn { stroke: rgba(111,144,112,0.45); stroke-dasharray: none; }

  /* Persistent chrome */
  #brand { left: 56px; top: 40px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; letter-spacing: 0.02em; }
  #brand img { width: 40px; height: 40px; }
  #progress { left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; gap: 10px; }
  #progress span { display: block; width: 46px; height: 5px; border-radius: 999px; background: var(--line-strong); overflow: hidden; }
  #progress i { display: block; height: 100%; width: 0; background: var(--accent-deep); border-radius: 999px; }

  /* Copy column */
  .copy { left: 96px; top: 0; height: 720px; width: 430px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--accent-deep); font-weight: 700; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
  .eyebrow b { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent-deep); color: #fbfaf5; font-size: 16px; letter-spacing: 0; }
  .title { font-size: 54px; line-height: 1.06; font-weight: 700; letter-spacing: -0.015em; }
  .underline { width: 96px; height: 6px; border-radius: 999px; background: var(--sun); transform-origin: left center; }

  /* Mock UI, reusing the app's card language */
  .card { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 18px 40px rgba(60, 53, 42, 0.08), 0 2px 6px rgba(60, 53, 42, 0.05); padding: 24px 26px; }
  .card h3 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .card h3 svg { width: 22px; height: 22px; color: var(--accent-deep); }
  .label { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field { height: 48px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; display: flex; align-items: center; padding: 0 14px; font-size: 18px; font-weight: 500; }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--accent-deep); margin-left: 2px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; background: var(--accent-deep); color: #fbfaf5; font-weight: 600; font-size: 17px; padding: 12px 22px; }
  .btn svg { width: 20px; height: 20px; }
  .btn.quiet { background: transparent; color: var(--accent-deep); border: 1px solid var(--line-strong); }
  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; background: var(--accent-soft); color: var(--accent-deep); }
  .badge svg { width: 15px; height: 15px; }
  .badge.warn { background: rgba(165, 73, 47, 0.12); color: var(--danger); }
  .bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .bar i.warn { background: var(--sun); }
  .cursor { position: absolute; width: 30px; height: 30px; color: var(--ink); filter: drop-shadow(0 3px 4px rgba(0,0,0,0.25)); }
  .cursor svg { width: 30px; height: 30px; fill: #fff; stroke: var(--ink); stroke-width: 1.6; }

  /* Scene specific */
  .shoe-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px 16px; align-items: center; padding: 18px 0; border-top: 1px solid var(--line); }
  .shoe-row:first-of-type { border-top: 0; }
  .shoe-icon { grid-row: span 2; width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-deep); display: grid; place-items: center; }
  .shoe-icon svg { width: 32px; height: 32px; }
  .shoe-name { font-size: 19px; font-weight: 700; }
  .shoe-km { font-size: 16px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .shoe-row .bar { grid-column: 2 / 4; }

  .phases { display: flex; gap: 8px; margin-top: 18px; }
  .phase { border-radius: 12px; padding: 12px 14px; color: #fbfaf5; font-weight: 700; font-size: 15px; display: flex; flex-direction: column; gap: 2px; transform-origin: left center; }
  .phase small { font-weight: 500; font-size: 13px; opacity: 0.85; }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 16px; }
  .day { border: 1px solid var(--line-strong); border-radius: 12px; height: 92px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; gap: 4px; font-weight: 700; font-size: 15px; background: #fff; }
  .day.on { background: var(--accent-deep); border-color: var(--accent-deep); color: #fbfaf5; }
  .day small { font-size: 13px; font-weight: 500; text-align: center; line-height: 1.2; }
  .workout { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; margin-top: 10px; }
  .workout .wday { font-weight: 700; color: var(--accent-deep); font-size: 15px; text-transform: uppercase; }
  .workout .wname { font-weight: 600; font-size: 17px; }
  .workout .wmeta { font-size: 14px; color: var(--muted); font-weight: 600; }
  .file-chip { display: inline-flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 16px; box-shadow: 0 10px 24px rgba(60,53,42,0.12); }
  .file-chip svg { width: 22px; height: 22px; color: var(--accent-deep); }

  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 14px; }
  .cal .head { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; text-align: center; padding-bottom: 4px; }
  .cal .cell { height: 92px; border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 6px 7px; font-size: 13px; font-weight: 600; color: var(--muted); position: relative; }
  .chip { position: absolute; left: 6px; right: 6px; bottom: 8px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-deep); font-weight: 700; font-size: 12.5px; line-height: 1.2; padding: 6px 6px 6px 7px; border-left: 4px solid var(--accent); overflow-wrap: anywhere; }

  .dropzone { height: 150px; border: 2px dashed var(--line-strong); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-weight: 600; font-size: 17px; margin-top: 16px; background: rgba(255,255,255,0.6); }
  .dropzone svg { width: 34px; height: 34px; color: var(--accent-deep); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fff; }
  .stat span { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  .stat b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .rpe { display: flex; gap: 12px; margin-top: 10px; }
  .rpe i { font-style: normal; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 20px; border: 2px solid var(--line-strong); background: #fff; color: var(--ink); }

  .line-item { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 500; margin-top: 14px; white-space: nowrap; overflow: hidden; }
  .line-item svg { flex: none; width: 22px; height: 22px; color: var(--accent-deep); }
  .source { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 600; background: #fff; margin: 10px 8px 0 0; }
  .source::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--sun); }

  .step-ring { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--line-strong); display: grid; place-items: center; color: var(--accent-deep); background: var(--card); position: relative; }
  .step-ring svg { width: 50px; height: 50px; }
  .step-check { position: absolute; right: -4px; bottom: -4px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent-deep); color: #fbfaf5; display: grid; place-items: center; }
  .step-check svg { width: 24px; height: 24px; stroke-width: 3; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="scene.js"></script>
</body>
</html>
